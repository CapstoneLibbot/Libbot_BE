
name: Build and Publish LiBot API

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the selected image to the Azure VM after publishing
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    name: Restore and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore LiBot.sln

      - name: Build solution
        run: dotnet build LiBot.sln --configuration Release --no-restore

  publish:
    name: Build and publish container
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/capstonelibbot/libbot-api:latest
            ghcr.io/capstonelibbot/libbot-api:${{ github.sha }}

  deploy:
    name: Deploy to Azure VM
    needs: publish
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy == true) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment configuration
        id: config
        env:
          AZURE_HOST: ${{ secrets.AZURE_HOST }}
          AZURE_USER: ${{ secrets.AZURE_USER }}
          AZURE_SSH_KEY: ${{ secrets.AZURE_SSH_KEY }}
          AZURE_KNOWN_HOSTS: ${{ secrets.AZURE_KNOWN_HOSTS }}
        run: |
          missing=0
          for name in AZURE_HOST AZURE_USER AZURE_SSH_KEY AZURE_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub secret: $name" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Install SSH configuration
        env:
          AZURE_SSH_KEY: ${{ secrets.AZURE_SSH_KEY }}
          AZURE_KNOWN_HOSTS: ${{ secrets.AZURE_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$AZURE_SSH_KEY" > "$HOME/.ssh/azure_deploy"
          chmod 600 "$HOME/.ssh/azure_deploy"
          printf '%s\n' "$AZURE_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy image by SSH
        env:
          AZURE_HOST: ${{ secrets.AZURE_HOST }}
          AZURE_USER: ${{ secrets.AZURE_USER }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_USERNAME: ${{ github.repository_owner }}
        run: |
          printf '%s' "$GHCR_READ_TOKEN" | ssh -i "$HOME/.ssh/azure_deploy" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$AZURE_USER@$AZURE_HOST" \
            "IMAGE_TAG='$IMAGE_TAG' GHCR_USERNAME='$GHCR_USERNAME' /var/www/libbot-api/deploy-azure.sh"
